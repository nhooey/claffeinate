# claffeinate's settings, each at its default.
#
# claffeinate reads this file on every start, from where it's installed.
# Don't copy it: put only the settings you change in
# ~/.config/claffeinate/config, in the same "setting = value" form, and they
# override these. 'claffeinate config' shows each value in effect and the
# layer it came from.

# The longest one hold keeps the Mac awake: 30s, 60m, 1h30m, 2d; a bare
# number is seconds.
awake-max-duration = 4h

# The battery percent, 0 to 100, at or below which holds end, on AC power
# too; 0 never ends a hold for the battery.
awake-min-battery = 20

# on or off: holds keep the Mac awake with its lid closed. on needs the
# sudoers rule 'claffeinate sudoers' prints; without it, closing the lid
# sleeps the Mac.
awake-lid-closed = on

# on or off: emoji in the status output. A locale that isn't UTF-8 turns
# them off whatever this says.
emoji = on
